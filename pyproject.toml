[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decadic-architecture"
version = "0.3.0"
description = "Decadic Cycle Cognitive Architecture — Phase 2–3 neural cognition + episodic similarity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "Pillow>=10.0",
    "httpx>=0.27",
    "vastai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=12",
]
body = [
    "mujoco>=3.1",
    "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["decadic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
