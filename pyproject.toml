[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decadic-architecture"
version = "0.3.0"
description = "Decadic Cycle Cognitive Architecture — Phase 2–3 neural cognition + episodic similarity"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Charles Richard Wayne Sears", email = "charles.r.sears@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "Pillow>=10.0",
    "httpx>=0.27",
    "vastai>=1.0",
]

[project.optional-dependencies]
# Default memory backends (WS4): episodic vectors on LanceDB, semantic graph on
# Kuzu. These are the runtime defaults, so a fresh install that runs the server
# needs this group; the legacy SQLite backends require no extra dependencies.
memory = [
    "lancedb>=0.34",
    "kuzu>=0.11",
    "pyarrow>=15",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=12",
    "matplotlib>=3.8",
]
body = [
    "mujoco>=3.1",
    "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["decadic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
